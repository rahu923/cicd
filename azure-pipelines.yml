# CI runs are batched so a newer push cannot overwrite staging during a release.
trigger:
  batch: true
  branches:
    include:
    - master

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  azureServiceConnection: 'azure-cicd-connection'
  webAppName: 'cicdwebapp'
  resourceGroupName: 'cicdrg'  
  webAppType: 'webApp' # Use webAppLinux for a Linux App Service.
  stagingSlot: 'staging'

stages:
- stage: BuildTest
  displayName: 'Build and test'
  jobs:
  - job: Build
    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.0.x'
    - task: DotNetCoreCLI@2
      displayName: 'Restore solution'
      inputs:
        command: 'restore'
        projects: 'cicd.sln'
    - task: DotNetCoreCLI@2
      displayName: 'Build solution'
      inputs:
        command: 'build'
        projects: 'cicd.sln'
        arguments: '--configuration $(buildConfiguration) --no-restore'
    - task: DotNetCoreCLI@2
      displayName: 'Run unit tests'
      inputs:
        command: 'test'
        projects: 'tests/cicdtest/cicdtest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'
        publishTestResults: true
    - task: DotNetCoreCLI@2
      displayName: 'Package web app'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'cicd.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/webapp'
        zipAfterPublish: false
        modifyOutputPath: false
    - task: ArchiveFiles@2
      displayName: 'Create webapp.zip'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/webapp'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/webapp.zip'
        replaceExistingArchive: true
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/webapp.zip'
        artifact: 'drop'

- stage: Staging
  displayName: 'Deploy to staging slot'
  dependsOn: BuildTest
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: DeployStaging
    environment: 'cicd-staging'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Deploy package to staging'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: '$(webAppType)'
              appName: '$(webAppName)'
              deployToSlotOrASE: true
              resourceGroupName: '$(resourceGroupName)'
              slotName: '$(stagingSlot)'
              package: '$(Pipeline.Workspace)/drop/webapp.zip'
              deploymentMethod: 'zipDeploy'
          - task: AzureCLI@2
            displayName: 'Check staging responds successfully'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $hostname = az webapp show --resource-group "$(resourceGroupName)" --name "$(webAppName)" --slot "$(stagingSlot)" --query defaultHostName --output tsv
                if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($hostname)) { throw 'Cannot resolve staging hostname.' }
                $url = "https://$($hostname.Trim())/health/ready"
                for ($attempt = 1; $attempt -le 12; $attempt++) {
                  try {
                    $response = Invoke-WebRequest -Uri $url -TimeoutSec 30 -SkipHttpErrorCheck
                    if ($response.StatusCode -eq 200) { Write-Host 'Staging check passed.'; exit 0 }
                    Write-Host "Staging returned HTTP $([int]$response.StatusCode) (attempt $attempt)."
                  } catch { Write-Host "Staging request failed before a response was received (attempt $attempt). Check slot availability, DNS, TLS, and network access." }
                  Start-Sleep -Seconds 10
                }
                throw 'Staging readiness failed; production promotion stopped. Check staging Log stream, ConnectionStrings__DefaultConnection, SQL access, and database initialization. See README.md.'

- stage: Production
  displayName: 'Promote staging to production'
  dependsOn: Staging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: PromoteProduction
    # Optional approval: configure Approvals and checks on this environment in Azure DevOps.
    environment: 'cicd-production'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: none
          - task: AzureAppServiceManage@0
            displayName: 'Swap staging into production'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              Action: 'Swap Slots'
              WebAppName: '$(webAppName)'
              ResourceGroupName: '$(resourceGroupName)'
              SourceSlot: '$(stagingSlot)'
              SwapWithProduction: true
